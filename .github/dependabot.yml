version: 2
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    # Consolidate updates into a single PR rather than one PR per crate
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # egui 0.37 needs craft-ui on egui 0.37 first (storytold/craft-libs#199).
      - dependency-name: "egui"
        versions: [">=0.37"]
      - dependency-name: "egui_kittest"
        versions: [">=0.37"]
      - dependency-name: "eframe"
        versions: [">=0.37"]
      - dependency-name: "egui-wgpu"
        versions: [">=0.37"]
      # acadrust 0.6.5 changes the bytes of a re-saved DWG; held at 0.6.4 until reviewed.
      - dependency-name: "acadrust"
        versions: [">0.6.4"]

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
